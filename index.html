<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cuinetes</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header>
    <h1>🍳 Cuinetes</h1>
    <nav class="menu" role="tablist" aria-label="Menu">
      <button class="menu-item" data-target="recipes" role="tab" aria-selected="false">Recipes</button>
      <button class="menu-item is-active" data-target="builds" role="tab" aria-selected="true">Build</button>
    </nav>
  </header>

  <main>
    <section id="recipes" class="panel" role="tabpanel" aria-label="Recipes">
      <h2>Recipes</h2>
      <table>
        <thead>
          <tr>
            <th>Name</th>
            <th>Dates</th>
            <th>Link</th>
            <th>Copy</th>
          </tr>
        </thead>
        <tbody>
        </tbody>
      </table>
    </section>

    <section id="builds" class="panel is-active" role="tabpanel" aria-label="Build">
      <h2>Build</h2>
      <table>
        <thead>
          <tr>
            <th>Version</th>
            <th>Dates</th>
            <th class="actions-col"></th>
          </tr>
        </thead>
        <tbody>
        </tbody>
      </table>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 Cuinetes</p>
  </footer>

  <script src="scripts.js"></script>
</body>
</html>
